<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUÁN NHẬU ONLINE THỨ 6 - REALTIME</title>
    <!-- Firebase App & Database SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-dark: #0f0c20;
            --panel-bg: rgba(20, 16, 45, 0.85);
            --neon-pink: #ff007f;
            --neon-blue: #00f3ff;
            --neon-gold: #ffb700;
            --neon-green: #39ff14;
            --text-light: #f0f0ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Modal Chọn Tên */
        .login-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-box {
            background: var(--panel-bg);
            border: 2px solid var(--neon-pink);
            box-shadow: 0 0 20px var(--neon-pink);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .login-box h2 {
            color: var(--neon-gold);
            margin-bottom: 15px;
        }

        .user-select-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .btn-user {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--neon-blue);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-user:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 10px var(--neon-blue);
        }

        /* Header Neon Sign */
        header {
            text-align: center;
            padding: 15px;
            background: rgba(10, 8, 25, 0.95);
            border-bottom: 2px solid var(--neon-pink);
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
        }

        h1.neon-title {
            font-size: 2.2rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 5px #fff, 0 0 20px var(--neon-pink);
        }

        .subtitle {
            color: var(--neon-blue);
            font-size: 0.95rem;
            margin-top: 5px;
        }

        /* Main Container Layout */
        .container {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            gap: 15px;
            padding: 15px;
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        @media (max-width: 1024px) {
            .container { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            font-size: 1.1rem;
            color: var(--neon-gold);
            border-bottom: 1px solid rgba(255, 183, 0, 0.3);
            padding-bottom: 8px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        /* Member List */
        .member-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            max-height: 500px;
        }

        .member-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 3px solid var(--neon-blue);
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-blue));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* Main Stage */
        .pub-stage {
            position: relative;
            background: radial-gradient(circle, rgba(40,30,80,0.6) 0%, rgba(15,12,32,0.9) 100%);
            border-radius: 15px;
            border: 2px solid var(--neon-blue);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            min-height: 480px;
        }

        .toast-banner {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--neon-gold);
            border-radius: 20px;
            padding: 8px 20px;
            font-size: 0.95rem;
            text-align: center;
        }

        .table-area {
            position: relative;
            width: 320px;
            height: 200px;
            background: #4a2c11;
            border-radius: 100px / 60px;
            border: 8px solid #2d1a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .beer-glass { font-size: 4rem; }

        .action-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            width: 100%;
        }

        .btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn:hover { background: var(--neon-pink); }

        /* Chat Panel */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            max-height: 350px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.85rem;
        }

        .msg .author {
            color: var(--neon-blue);
            font-weight: bold;
        }

        .chat-input-group {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }

        .chat-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            padding: 8px 10px;
            color: #fff;
        }

        .btn-send {
            background: var(--neon-blue);
            color: #000;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Modal chọn danh tính khi bắt đầu -->
    <div class="login-overlay" id="login-overlay">
        <div class="login-box">
            <h2>CHỌN TÊN ĐỂ VÀO BÀN</h2>
            <p style="font-size: 0.85rem; color: #ccc;">Vui lòng chọn danh tính của bạn:</p>
            <div class="user-select-grid" id="user-select-grid"></div>
        </div>
    </div>

    <header>
        <h1 class="neon-title">🍻 QUÁN NHẬU ONLINE THỨ 6 🍻</h1>
        <div class="subtitle" id="current-user-display">Chưa nhập bàn nhậu</div>
    </header>

    <div class="container">
        <!-- Thành viên bàn nhậu -->
        <div class="panel">
            <div class="panel-title">
                <span>Bàn Nhậu Chiến Hữu</span>
                <span style="font-size: 0.8rem; color: var(--neon-green);" id="online-count">0 Online</span>
            </div>
            <div class="member-list" id="member-list"></div>
        </div>

        <!-- Sân nhậu trung tâm -->
        <div class="pub-stage">
            <div class="toast-banner" id="toast-banner">
                📢 Chọn tên để tham gia bàn nhậu realtime!
            </div>

            <div class="table-area" onclick="doCheers()">
                <div class="beer-glass">🍺</div>
            </div>

            <div class="action-bar">
                <button class="btn" onclick="doCheers()">🍻 Cụm Ly 100%</button>
                <button class="btn" onclick="sendAction('rót đầy ly bia! 🍺')">🍺 Rót Đầy Ly</button>
                <button class="btn" onclick="sendAction('gọi thêm mồi ngon! 🍗')">🍖 Gọi Mồi Ngon</button>
                <button class="btn" onclick="sendAction('bật Karaoke hát sương sương! 🎤')">🎤 Hát Karaoke</button>
            </div>
        </div>

        <!-- Chat Realtime -->
        <div class="panel">
            <div class="panel-title">Trò Chuyện Realtime</div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-group">
                <input type="text" class="chat-input" id="chat-input" placeholder="Nhập tin nhắn..." onkeypress="handleKeyPress(event)">
                <button class="btn-send" onclick="sendMessage()">Gửi</button>
            </div>
        </div>
    </div>

    <script>
        // Cấu hình Firebase Realtime Database
        const firebaseConfig = {
            databaseURL: "https://quan-nhau-online-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const memberNames = ["Thanh Quí", "Quang Hoà", "Lê Hoàng", "Thế Vũ", "Thanh Chính", "Trọng Tình", "Đình Dũng"];
        let currentUser = null;

        // Tạo nút chọn danh tính
        const userGrid = document.getElementById('user-select-grid');
        memberNames.forEach(name => {
            const btn = document.createElement('button');
            btn.className = 'btn-user';
            btn.innerText = name;
            btn.onclick = () => selectUser(name);
            userGrid.appendChild(btn);
        });

        function selectUser(name) {
            currentUser = name;
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('current-user-display').innerText = `Tài khoản: ${currentUser} (Đang Online)`;
            
            // Đăng ký trạng thái online lên Firebase
            const userRef = db.ref('presence/' + currentUser);
            userRef.set({ name: currentUser, online: true, drunk: 0 });
            userRef.onDisconnect().remove();

            // Thông báo vào bàn
            db.ref('chats').push({ author: "Hệ thống", text: `${currentUser} vừa vào bàn nhậu! 🍻` });
        }

        // Lắng nghe danh sách Online
        db.ref('presence').on('value', snapshot => {
            const data = snapshot.val() || {};
            const activeList = Object.keys(data);
            document.getElementById('online-count').innerText = `${activeList.length} Online`;

            const listEl = document.getElementById('member-list');
            listEl.innerHTML = memberNames.map(name => {
                const isOnline = activeList.includes(name);
                return `
                    <div class="member-card" style="opacity: ${isOnline ? 1 : 0.4}">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <div class="avatar">${name.charAt(0)}</div>
                            <div>
                                <div style="font-weight:bold">${name}</div>
                                <div style="font-size:0.75rem; color:${isOnline ? 'var(--neon-green)' : '#888'}">
                                    ${isOnline ? '● Đang nhậu' : '○ Vắng mặt'}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        });

        // Lắng nghe tin nhắn realtime
        db.ref('chats').limitToLast(20).on('child_added', snapshot => {
            const msg = snapshot.val();
            const chatBox = document.getElementById('chat-messages');
            const msgEl = document.createElement('div');
            msgEl.className = 'msg';
            msgEl.innerHTML = `<span class="author">${msg.author}:</span> ${msg.text}`;
            chatBox.appendChild(msgEl);
            chatBox.scrollTop = chatBox.scrollHeight;

            document.getElementById('toast-banner').innerText = `📢 ${msg.author}: "${msg.text}"`;
        });

        function sendMessage() {
            if (!currentUser) return alert("Vui lòng chọn tên trước!");
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (text) {
                db.ref('chats').push({ author: currentUser, text: text });
                input.value = '';
            }
        }

        function sendAction(actionText) {
            if (!currentUser) return;
            db.ref('chats').push({ author: currentUser, text: actionText });
        }

        function doCheers() {
            if (!currentUser) return;
            db.ref('chats').push({ author: currentUser, text: "vừa CỤM LY ZÔ 100%! 💥🍻" });
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
