<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUÁN NHẬU ONLINE THỨ 6 - REALTIME LIVE</title>
    <style>
        :root {
            --bg-dark: #0f0c20;
            --panel-bg: rgba(20, 16, 45, 0.85);
            --neon-pink: #ff007f;
            --neon-blue: #00f3ff;
            --neon-gold: #ffb700;
            --neon-green: #39ff14;
            --text-light: #f0f0ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: filter 0.5s ease;
        }

        /* Modal Chọn Tên */
        .login-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(8px);
        }

        .login-box {
            background: var(--panel-bg);
            border: 2px solid var(--neon-pink);
            box-shadow: 0 0 30px var(--neon-pink);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        .login-box h2 {
            color: var(--neon-gold);
            margin-bottom: 15px;
            text-shadow: 0 0 10px var(--neon-gold);
        }

        .user-select-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .btn-user {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--neon-blue);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-user:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 15px var(--neon-blue);
        }

        /* Header Neon Sign */
        header {
            text-align: center;
            padding: 15px;
            background: rgba(10, 8, 25, 0.95);
            border-bottom: 2px solid var(--neon-pink);
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
            position: relative;
            z-index: 10;
        }

        h1.neon-title {
            font-size: 2.2rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px var(--neon-pink),
                0 0 30px var(--neon-pink);
            animation: blink 2s infinite alternate;
        }

        .subtitle {
            color: var(--neon-blue);
            font-size: 0.95rem;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }

        /* Container Layout */
        .container {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            gap: 15px;
            padding: 15px;
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        @media (max-width: 1024px) {
            .container { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            font-size: 1.1rem;
            color: var(--neon-gold);
            border-bottom: 1px solid rgba(255, 183, 0, 0.3);
            padding-bottom: 8px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Member List */
        .member-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            max-height: 500px;
        }

        .member-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 3px solid var(--neon-blue);
            transition: all 0.3s ease;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-blue));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            color: #fff;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
        }
        .online-dot { background: var(--neon-green); box-shadow: 0 0 6px var(--neon-green); }
        .offline-dot { background: #666; }

        /* Main Pub Stage */
        .pub-stage {
            position: relative;
            background: radial-gradient(circle, rgba(40,30,80,0.6) 0%, rgba(15,12,32,0.9) 100%), url('https://images.unsplash.com/photo-1514933651103-005eec06c04b?auto=format&fit=crop&w=1000&q=80') center/cover;
            border-radius: 15px;
            border: 2px solid var(--neon-blue);
            box-shadow: inset 0 0 30px rgba(0, 243, 255, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            min-height: 480px;
            overflow: hidden;
        }

        .toast-banner {
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid var(--neon-gold);
            border-radius: 20px;
            padding: 8px 20px;
            color: #fff;
            font-size: 0.95rem;
            max-width: 80%;
            text-align: center;
            box-shadow: 0 0 10px rgba(255, 183, 0, 0.5);
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.03); }
        }

        /* Wooden Table & Beer Glass */
        .table-area {
            position: relative;
            width: 320px;
            height: 200px;
            background: #4a2c11;
            border-radius: 100px / 60px;
            border: 8px solid #2d1a0a;
            box-shadow: 0 15px 25px rgba(0,0,0,0.6), inset 0 0 20px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            cursor: pointer;
        }

        .beer-glass {
            font-size: 4rem;
            transition: transform 0.15s ease;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));
        }

        .cheers-effect {
            position: absolute;
            font-size: 2rem;
            font-weight: bold;
            color: var(--neon-gold);
            text-shadow: 0 0 10px #ff0000;
            pointer-events: none;
            opacity: 0;
            transition: all 0.5s ease-out;
        }

        .food-items {
            position: absolute;
            bottom: 25px;
            display: flex;
            gap: 15px;
            font-size: 1.8rem;
        }

        /* Action Buttons */
        .action-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            width: 100%;
        }

        .btn {
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--neon-pink);
            border-color: var(--neon-pink);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
            transform: translateY(-2deg);
        }

        /* Chat Panel */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            max-height: 350px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        .msg {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .msg .author {
            color: var(--neon-blue);
            font-weight: bold;
            margin-bottom: 2px;
        }

        .chat-input-group {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }

        .chat-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            padding: 8px 10px;
            color: #fff;
            outline: none;
        }

        .btn-send {
            background: var(--neon-blue);
            color: #000;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Modal chọn danh tính -->
    <div class="login-overlay" id="login-overlay">
        <div class="login-box">
            <h2>CHỌN TÊN ĐỂ VÀO BÀN NHẬU</h2>
            <p style="font-size: 0.85rem; color: #ccc;">Vui lòng chọn danh tính của bạn:</p>
            <div class="user-select-grid" id="user-select-grid"></div>
        </div>
    </div>

    <header>
        <h1 class="neon-title">🍻 QUÁN NHẬU ONLINE THỨ 6 🍻</h1>
        <div class="subtitle" id="current-user-display">Trạng thái: Vui lòng chọn danh tính</div>
    </header>

    <div class="container">
        <!-- Bàn nhậu chiến hữu -->
        <div class="panel">
            <div class="panel-title">
                <span>Bàn Nhậu Chiến Hữu</span>
                <span style="font-size: 0.8rem; color: var(--neon-green);" id="online-count">0 Online</span>
            </div>
            <div class="member-list" id="member-list"></div>
        </div>

        <!-- Sân nhậu trung tâm -->
        <div class="pub-stage">
            <div class="toast-banner" id="toast-banner">
                📢 Chọn tên để tham gia bàn nhậu Zô 100% cùng anh em!
            </div>

            <div class="table-area" onclick="sendAction('cheers')">
                <div class="beer-glass" id="beer-glass">🍺</div>
                <div class="cheers-effect" id="cheers-effect">ZÔ 100%! 💥</div>
                <div class="food-items" id="food-items"></div>
            </div>

            <div class="action-bar">
                <button class="btn" onclick="sendAction('cheers')">
                    <span>🍻</span> Cụm Ly 100%
                </button>
                <button class="btn" onclick="sendAction('pour')">
                    <span>🍺</span> Rót Đầy Ly
                </button>
                <button class="btn" onclick="sendAction('food')">
                    <span>🍖</span> Gọi Mồi Ngon
                </button>
                <button class="btn" onclick="sendAction('karaoke')">
                    <span>🎤</span> Hát Karaoke
                </button>
            </div>
        </div>

        <!-- Chat Realtime -->
        <div class="panel">
            <div class="panel-title">Trò Chuyện Realtime</div>
            <div class="chat-messages" id="chat-messages">
                <div class="msg"><span class="author">Hệ thống:</span> Chào mừng anh em đến với QUÁN NHẬU ONLINE THỨ 6!</div>
            </div>
            <div class="chat-input-group">
                <input type="text" class="chat-input" id="chat-input" placeholder="Nhập tin nhắn / Lời chúc..." onkeypress="handleKeyPress(event)">
                <button class="btn-send" onclick="sendMessage()">Gửi</button>
            </div>
        </div>
    </div>

    <script>
        const membersList = ["Thanh Quí", "Quang Hoà", "Lê Hoàng", "Thế Vũ", "Thanh Chính", "Trọng Tình", "Đình Dũng"];
        const memberStats = {};
        membersList.forEach(m => memberStats[m] = { online: false, drunk: 0 });

        let currentUser = null;
        let totalDrunkLevel = 0;
        const foods = ["🍗", "🥩", "🦪", "🦐", "🦑", "🥜", "🍢"];

        // BroadcastChannel & WebSocket đồng bộ 2 chiều
        const bc = new BroadcastChannel('quan_nhau_channel');
        const ws = new WebSocket('wss://free.chatws.com');

        // Tạo nút danh tính
        const grid = document.getElementById('user-select-grid');
        membersList.forEach(name => {
            const btn = document.createElement('button');
            btn.className = 'btn-user';
            btn.innerText = name;
            btn.onclick = () => selectUser(name);
            grid.appendChild(btn);
        });

        // Web Audio API âm thanh cụm ly
        function playClinkSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch(e) {}
        }

        function selectUser(name) {
            currentUser = name;
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('current-user-display').innerText = `Tài khoản: ${currentUser} (Đang Online)`;
            
            memberStats[currentUser].online = true;
            renderMembers();

            broadcast({ type: 'JOIN', user: currentUser });

            setInterval(() => {
                if (currentUser) broadcast({ type: 'PING', user: currentUser });
            }, 4000);
        }

        function broadcast(data) {
            const payload = JSON.stringify(data);
            bc.postMessage(payload);
            if (ws.readyState === WebSocket.OPEN) ws.send(payload);
        }

        function handleIncomingData(raw) {
            try {
                const data = typeof raw === 'string' ? JSON.parse(raw) : raw;
                if (!data || !data.type) return;

                if (data.user && memberStats[data.user]) {
                    memberStats[data.user].online = true;
                }

                switch (data.type) {
                    case 'JOIN':
                        addChatMessage("Hệ thống", `${data.user} vừa vào bàn nhậu! 🍻`);
                        renderMembers();
                        break;
                    case 'PING':
                        renderMembers();
                        break;
                    case 'CHAT':
                        addChatMessage(data.user, data.text);
                        document.getElementById('toast-banner').innerText = `📢 ${data.user}: "${data.text}"`;
                        break;
                    case 'ACTION':
                        executeAction(data.user, data.action);
                        break;
                }
            } catch (e) {}
        }

        bc.onmessage = (e) => handleIncomingData(e.data);
        ws.onmessage = (e) => handleIncomingData(e.data);

        function renderMembers() {
            let onlineCnt = 0;
            const listEl = document.getElementById('member-list');
            listEl.innerHTML = membersList.map(name => {
                const isOnline = memberStats[name].online;
                if (isOnline) onlineCnt++;
                return `
                    <div class="member-card" style="opacity: ${isOnline ? 1 : 0.45}">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <div class="avatar">${name.charAt(0)}</div>
                            <div>
                                <div style="font-weight:bold">${name}</div>
                                <div style="font-size:0.75rem;">
                                    <span class="status-dot ${isOnline ? 'online-dot' : 'offline-dot'}"></span>
                                    ${isOnline ? 'Đang nhậu' : 'Vắng mặt'}
                                </div>
                            </div>
                        </div>
                        <div style="font-size:0.8rem; color:var(--neon-gold); font-weight:bold;">
                            🍺 ${memberStats[name].drunk}%
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('online-count').innerText = `${onlineCnt} Online`;
        }

        function executeAction(user, action) {
            const glass = document.getElementById('beer-glass');
            if (memberStats[user]) {
                memberStats[user].drunk = Math.min(100, memberStats[user].drunk + 10);
            }
            totalDrunkLevel = Math.min(100, totalDrunkLevel + 2);
            renderMembers();
            applyDrunkEffect();

            if (action === 'cheers') {
                playClinkSound();
                const effect = document.getElementById('cheers-effect');
                effect.style.opacity = '1';
                effect.style.transform = 'translateY(-20px) scale(1.2)';
                setTimeout(() => {
                    effect.style.opacity = '0';
                    effect.style.transform = 'translateY(0) scale(1)';
                }, 600);

                glass.style.transform = 'scale(1.3) rotate(-15deg)';
                setTimeout(() => glass.style.transform = 'scale(1) rotate(0deg)', 200);

                document.getElementById('toast-banner').innerText = `💥 ${user} vừa CỤM LY ZÔ 100%! 🍻`;
                addChatMessage(user, "vừa CỤM LY ZÔ 100%! 💥🍻");
            } else if (action === 'pour') {
                glass.style.transform = 'scale(1.2) rotate(15deg)';
                setTimeout(() => glass.style.transform = 'scale(1) rotate(0deg)', 300);
                document.getElementById('toast-banner').innerText = `🍺 ${user} vừa rót đầy ly bia!`;
                addChatMessage(user, "vừa rót đầy ly bia mát lạnh! 🍺");
            } else if (action === 'food') {
                const foodContainer = document.getElementById('food-items');
                const randFood = foods[Math.floor(Math.random() * foods.length)];
                if (foodContainer.children.length > 5) foodContainer.innerHTML = '';
                const item = document.createElement('span');
                item.innerText = randFood;
                foodContainer.appendChild(item);
                document.getElementById('toast-banner').innerText = `🍖 ${user} gọi món ngon ${randFood}!`;
                addChatMessage(user, `vừa gọi món ngon ${randFood}!`);
            } else if (action === 'karaoke') {
                document.getElementById('toast-banner').innerText = `🎤 ${user} bật Karaoke hát sương sương!`;
                addChatMessage(user, "bật Karaoke hát sương sương! 🎤");
            }
        }

        function sendAction(action) {
            if (!currentUser) return alert("Vui lòng chọn tên trước!");
            executeAction(currentUser, action);
            broadcast({ type: 'ACTION', user: currentUser, action: action });
        }

        function sendMessage() {
            if (!currentUser) return alert("Vui lòng chọn tên trước!");
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (text) {
                addChatMessage(currentUser, text);
                document.getElementById('toast-banner').innerText = `💬 ${currentUser}: "${text}"`;
                broadcast({ type: 'CHAT', user: currentUser, text: text });
                input.value = '';
            }
        }

        function addChatMessage(author, text) {
            const chatBox = document.getElementById('chat-messages');
            const msgEl = document.createElement('div');
            msgEl.className = 'msg';
            msgEl.innerHTML = `<span class="author">${author}:</span> ${text}`;
            chatBox.appendChild(msgEl);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function applyDrunkEffect() {
            if (totalDrunkLevel > 40) {
                const blurVal = (totalDrunkLevel - 40) / 30;
                document.body.style.filter = `blur(${blurVal}px)`;
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        renderMembers();
    </script>
</body>
</html>
